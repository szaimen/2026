<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Music Advent Calendar 2026</title>
  <meta name="description" content="24 doors, one for every day until Christmas.">
  <meta name="theme-color" content="#050b18">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- .gframe elements get their plant garland from script.js -->
  <div class="page gframe">
    <h1 class="page-title gf-title">Music Advent Calendar 2026</h1>
    <main id="calendar" class="calendar gf-content" aria-label="Advent calendar"></main>
  </div>

  <dialog id="lightbox" class="lightbox" aria-label="Opened door">
    <figure class="heart-card gframe">
      <figcaption id="lightbox-caption" class="gf-title"></figcaption>
      <div class="heart-body gf-content"><img id="lightbox-img" alt=""></div>
      <button type="button" class="lightbox-close" aria-label="Close">&times;</button>
    </figure>
  </dialog>

  <dialog id="intro" class="intro" aria-labelledby="intro-title">
    <div class="snow" aria-hidden="true"></div>
    <form method="dialog" class="intro-card gframe">
      <div class="intro-body gf-content">
        <h2 id="intro-title">Music Advent<br>Calendar 2026</h2>

        <div class="divider" aria-hidden="true"><span></span><svg viewBox="0 0 24 24"><path d="M12 1l2.6 7.4L22 9l-6 4.6L18.2 21 12 16.8 5.8 21 8 13.6 2 9l7.4-.6z"/></svg><span></span></div>

        <dl class="credits">
          <div><dt>Photos</dt><dd>Angie Erin</dd></div>
          <div><dt>Music</dt><dd>Jürgen Lindner</dd></div>
        </dl>

        <p class="made-by">made with <span class="heart">❤️</span> by Simon Lindner</p>

        <button type="submit" class="intro-start" autofocus>Continue</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
